services:
  # ----------------------------------------
  # INFRASTRUCTURE SERVICES
  # ----------------------------------------

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: metriflow-sqlserver-dev
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB_PASSWORD:-localpassword123!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data_dev:/var/opt/mssql
    networks:
      - metriflow-net-dev

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: metriflow-rabbitmq-dev
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: mypassword
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    networks:
      - metriflow-net-dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 15s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: metriflow-redis-dev
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - metriflow-net-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------
  # APPLICATION SERVICES
  # ----------------------------------------

  # metriflow-api:
