  #     context: .
  #     dockerfile: src/Execution/Metriflow.API/Dockerfile.dev
  #   restart: always
  #   depends_on:
  #     - db
  #     - redis
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - DOTNET_USE_POLLING_FILE_WATCHER=true
  #     - ConnectionStrings__Sqlserver=Server=db,1433;Database=metriflow_db;User Id=sa;Password=${DB_PASSWORD:-localpassword123!};TrustServerCertificate=True;
  #     - ConnectionStrings__Redis=redis:6379
  #     - ASPNETCORE_URLS=http://+:8080
  #   ports:
  #     - "8080:8080"
  #     - "8081:8081"
  #   volumes:
  #     # Mount source code for hot reload
  #     - ./src:/app/src:ro
  #   networks:
  #     - metriflow-net-dev

  metriflow-correlation-worker:
    container_name: metriflow-correlation-worker-dev
    build:
      context: .
      dockerfile: src/Execution/Metriflow.Correlation.Worker/Dockerfile.dev
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=user
      - RabbitMQ__Password=mypassword
      - ConnectionStrings__Redis=redis:6379
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
    networks:
      - metriflow-net-dev

