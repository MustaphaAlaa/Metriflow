      dockerfile: src/Execution/Metriflow.Matcher.Worker/Dockerfile.dev
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=user
      - RabbitMQ__Password=mypassword
      - ConnectionStrings__Redis=redis:6379
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
    networks:
      - metriflow-net-dev

  metriflow-producer:
    container_name: metriflow-producer-dev
    build:
      context: .
      dockerfile: src/Execution/Metriflow.Producer/Dockerfile.dev
    depends_on:
