services:
  # ----------------------------------------
  # INFRASTRUCTURE SERVICES
  # ----------------------------------------
  
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: metriflow-rabbitmq-dev
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: mypassword
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    networks:
      - metriflow-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 5s
      timeout: 15s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: metriflow-redis-dev
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - metriflow-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  database:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: metriflow-sqlserver-dev
    user: root # Often required to ensure permissions for volume mounting
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Sa123456 # SQL Server requires a complex password
      - MSSQL_PID=Developer
      - MSSQL_DB=metriflowdb
    ports:
      - "6800:1433"
    volumes:
      - metriflow_sqlserver_data_dev:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Sa123456' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - metriflow-net

  # ----------------------------------------
  # APPLICATION SERVICES
  # ----------------------------------------

  metriflow-api:
    container_name: metriflow-api-dev
    build:
      context: .
      dockerfile: src/Execution/Metriflow.API/Dockerfile.dev
    restart: always
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MSSQL: Server=database,1433;Database=metriflowdb;User Id=sa;Password=Sa123456;TrustServerCertificate=True;
      ConnectionStrings__Redis: redis:6379
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: user
      RabbitMQ__Password: mypassword
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./src:/app/src
    networks:
      - metriflow-net

  metriflow-aggregation-worker:
    container_name: metriflow-aggregation-worker-dev
    build:
      context: .
      dockerfile: src/Execution/Metriflow.AggregationWorker/Dockerfile.dev
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development 
      ConnectionStrings__MSSQL: Server=database,1433;Database=metriflowdb;User Id=sa;Password=Sa123456;TrustServerCertificate=True;
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: user
      RabbitMQ__Password: mypassword
      RabbitMQ__Exchange: analytics.raw
      RabbitMQ__Queues__IntervalAggregation: metriflow.interval.aggregation
      RabbitMQ__Queues__DailyAggregation: metriflow.daily.aggregation
      RabbitMQ__Queues__MonthlyAggregation: metriflow.monthly.aggregation
      RabbitMQ__Queues__YearlyAggregation: metriflow.yearly.aggregation
      RabbitMQ__Queues__AggregationCompleted: metriflow.aggregation.completed
      RabbitMQ__Queues__AggregationFailed: metriflow.aggregation.failed
      RabbitMQ__Queues__GA: metriflow.analytics.GA
      RabbitMQ__Queues__PSI: metriflow.analytics.PSI
      RabbitMQ__Queues__Correlation: metriflow.analytics.Correlation

    volumes:
      - ./src:/app/src
    networks:
      - metriflow-net

  metriflow-producers:
    container_name: metriflow-producers-dev
    build:
      context: .
      dockerfile: src/Execution/Metriflow.Producer/Dockerfile.dev
    
    depends_on:
      rabbitmq:
        condition: service_healthy
      metriflow-aggregation-worker:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: user
      RabbitMQ__Password: mypassword
      RabbitMQ__Exchange: analytics.raw
      RabbitMQ__Queues__GA: metriflow.analytics.GA
      RabbitMQ__Queues__PSI: metriflow.analytics.PSI
      RabbitMQ__Queues__Correlation: metriflow.analytics.Correlation

    volumes:
      - ./src:/app/src
    networks:
      - metriflow-net

# ----------------------------------------
# VOLUMES & NETWORKS
# ----------------------------------------
volumes:
  metriflow_sqlserver_data_dev:
networks:
  metriflow-net:
    driver: bridge
