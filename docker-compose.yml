services:
  # ----------------------------------------
  # INFRASTRUCTURE SERVICES
  # ----------------------------------------
  
  
  
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: metriflow-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: mypassword
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    networks:
      - metriflow-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 5s
      timeout: 15s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: metriflow-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - metriflow-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

