  metriflow-aggregation-worker:
    container_name: metriflow-AggregationWorker
    build:
      context: .
      dockerfile: src/Execution/Metriflow.AggregationWorker/Dockerfile
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=database;Port=5432;Database=metriflowdb;Username=postgres;Password=0000
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: user
      RabbitMQ__Password: mypassword
      RabbitMQ__Exchange: analytics.raw
      RabbitMQ__Queues__IntervalAggregation: metriflow.interval.aggregation
      RabbitMQ__Queues__DailyAggregation: metriflow.daily.aggregation
      RabbitMQ__Queues__MonthlyAggregation: metriflow.monthly.aggregation
      RabbitMQ__Queues__YearlyAggregation: metriflow.yearly.aggregation
      RabbitMQ__Queues__AggregationCompleted: metriflow.aggregation.completed
      RabbitMQ__Queues__AggregationFailed: metriflow.aggregation.failed
      RabbitMQ__Queues__GA: metriflow.analytics.GA
      RabbitMQ__Queues__PSI: metriflow.analytics.PSI    
    networks:
      - metriflow-net

  metriflow-producers:
    container_name: metriflow-producers
    build:
      context: .
      dockerfile: src/Execution/Metriflow.Producer/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      metriflow-aggregation-worker:
          condition: service_started
    environment:
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=user
      - RabbitMQ__Password=mypassword
      - RabbitMQ__Exchange=analytics.raw
      - RabbitMQ__Queues__GA=metriflow.analytics.GA
      - RabbitMQ__Queues__PSI=metriflow.analytics.PSI
    networks:
      - metriflow-net 


  database:
    image: postgres:17
    container_name: Metriflow_postgreSQL_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0000
      POSTGRES_DB: metriflowdb
    ports:
      - "6800:5432"
    volumes:
      - metriflow_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d metriflowdb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - metriflow-net
# ----------------------------------------
# VOLUMES & NETWORKS
# ----------------------------------------
volumes:
  metriflow_postgres_data:

networks:
  metriflow-net:
    driver: bridge
